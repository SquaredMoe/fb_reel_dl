[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-reel-dl"
version = "1.0.0"
description = "Facebook Reels Bulk Downloader 📱 — Playwright + yt-dlp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "nanofatdog", email = "nutboy02.ai@gmail.com"},
]
keywords = [
    "facebook", "reels", "downloader", "video", "playwright", "yt-dlp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "playwright>=1.40.0",
    "yt-dlp>=2024.0.0",
    "browser-cookie3>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/nanofatdog/fb_reel_dl"
Repository = "https://github.com/nanofatdog/fb_reel_dl"
BugTracker = "https://github.com/nanofatdog/fb_reel_dl/issues"

[project.scripts]
fb-reel-dl = "fb_reel_dl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
